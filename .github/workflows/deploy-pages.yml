name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/iphone-pwa-sampler-a3P35]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vite reads `BASE` env to set the asset base path. For a project-site
      # (https://<user>.github.io/<repo>/), this must be "/<repo>/".
      - name: Build
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # SPA-style 404 fallback: GitHub Pages will serve 404.html for paths
      # that don't resolve, which then loads our SW + app shell.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      # GitHub Pages requires .nojekyll so that files starting with "_" are served.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
